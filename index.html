<script id="ckr-music-script">
(function () {
  const tracks = [
    { name: "Wonders of the Earth", src: "./music/wonders-of-the-earth.mp3" },
    { name: "Total War — Epic Action", src: "./music/total-war-epic-action.mp3" },
    { name: "Music Promotion", src: "./music/music-promotion.mp3" }
  ];

  function initMusicPlayer() {
    if (document.getElementById("ckr-music-player")) return;

    const player = document.createElement("div");
    player.id = "ckr-music-player";
    player.innerHTML = `
      <div id="ckr-music-panel" aria-label="Website music player">
        <div id="ckr-music-title">CLOVER KINGDOM REVOLUTION • MUSIC</div>
        <div id="ckr-music-track">Wonders of the Earth</div>
        <div id="ckr-music-controls">
          <button type="button" id="ckr-prev" aria-label="Previous track">⏮</button>
          <button type="button" id="ckr-play" aria-label="Play music">▶ Play</button>
          <button type="button" id="ckr-next" aria-label="Next track">⏭</button>
          <button type="button" id="ckr-mute" aria-label="Mute music">🔊</button>
        </div>
        <select id="ckr-music-select" aria-label="Choose music">
          ${tracks.map((t, i) => `<option value="${i}">${t.name}</option>`).join("")}
        </select>
        <input id="ckr-music-volume" type="range" min="0" max="1" step="0.01" value="0.35"
               aria-label="Music volume">
      </div>
      <button type="button" id="ckr-music-toggle" aria-expanded="false">♫ MUSIC</button>
    `;
    document.body.appendChild(player);

    const audio = new Audio();
    audio.preload = "metadata";
    audio.loop = false;
    audio.volume = 0.35;
    let current = 0;

    const panel = player.querySelector("#ckr-music-panel");
    const toggle = player.querySelector("#ckr-music-toggle");
    const play = player.querySelector("#ckr-play");
    const prev = player.querySelector("#ckr-prev");
    const next = player.querySelector("#ckr-next");
    const mute = player.querySelector("#ckr-mute");
    const select = player.querySelector("#ckr-music-select");
    const volume = player.querySelector("#ckr-music-volume");
    const title = player.querySelector("#ckr-music-track");

    function loadTrack(index, autoplay) {
      current = (index + tracks.length) % tracks.length;
      audio.src = tracks[current].src;
      title.textContent = tracks[current].name;
      select.value = String(current);
      if (autoplay) {
        audio.play().then(() => {
          play.textContent = "⏸ Pause";
        }).catch(() => {
          play.textContent = "▶ Play";
        });
      } else {
        play.textContent = "▶ Play";
      }
    }

    toggle.addEventListener("click", () => {
      const open = player.classList.toggle("open");
      toggle.setAttribute("aria-expanded", String(open));
    });

    play.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().then(() => {
          play.textContent = "⏸ Pause";
        }).catch(() => {
          play.textContent = "▶ Play";
        });
      } else {
        audio.pause();
        play.textContent = "▶ Play";
      }
    });

    prev.addEventListener("click", () => loadTrack(current - 1, true));
    next.addEventListener("click", () => loadTrack(current + 1, true));
    select.addEventListener("change", e => loadTrack(Number(e.target.value), true));

    mute.addEventListener("click", () => {
      audio.muted = !audio.muted;
      mute.textContent = audio.muted ? "🔇" : "🔊";
    });

    volume.addEventListener("input", e => {
      audio.volume = Number(e.target.value);
      if (audio.volume > 0 && audio.muted) {
        audio.muted = false;
        mute.textContent = "🔊";
      }
    });

    audio.addEventListener("ended", () => {
      loadTrack(current + 1, true);
    });

    loadTrack(0, false);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initMusicPlayer);
  } else {
    initMusicPlayer();
  }
})();
</script>
