    <script id="ckr-music-script">

    (function () {

        /*
         * GitHub Pages repository base path.
         *
         * Repository:
         * clover-kingdom-revolution
         */

        const BASE_PATH =
            "/clover-kingdom-revolution/";


        /*
         * MUSIC TRACKS
         */

        const tracks = [

            {
                name: "Wonders of the Earth",
                src:
                    BASE_PATH +
                    "music/wonders-of-the-earth.mp3"
            },

            {
                name: "Total War — Epic Action",
                src:
                    BASE_PATH +
                    "music/total-war-epic-action.mp3"
            },

            {
                name: "Music Promotion",
                src:
                    BASE_PATH +
                    "music/music-promotion.mp3"
            }

        ];


        /*
         * INITIALIZE PLAYER
         */

        function initMusicPlayer() {

            if (
                document.getElementById(
                    "ckr-music-player"
                )
            ) {
                return;
            }


            /*
             * PLAYER HTML
             */

            const player =
                document.createElement("div");

            player.id =
                "ckr-music-player";


            player.innerHTML = `

                <div
                    id="ckr-music-panel"
                    aria-label="Website music player"
                >

                    <div id="ckr-music-title">
                        CLOVER KINGDOM REVOLUTION • MUSIC
                    </div>


                    <div id="ckr-music-track">
                        Wonders of the Earth
                    </div>


                    <div id="ckr-music-controls">

                        <button
                            type="button"
                            id="ckr-prev"
                            aria-label="Previous track"
                        >
                            ⏮
                        </button>


                        <button
                            type="button"
                            id="ckr-play"
                            aria-label="Play music"
                        >
                            ▶ Play
                        </button>


                        <button
                            type="button"
                            id="ckr-next"
                            aria-label="Next track"
                        >
                            ⏭
                        </button>


                        <button
                            type="button"
                            id="ckr-mute"
                            aria-label="Mute music"
                        >
                            🔊
                        </button>

                    </div>


                    <select
                        id="ckr-music-select"
                        aria-label="Choose music"
                    >

                        ${tracks.map(
                            (track, index) =>

                                `<option value="${index}">
                                    ${track.name}
                                </option>`
                        ).join("")}

                    </select>


                    <input
                        id="ckr-music-volume"
                        type="range"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.35"
                        aria-label="Music volume"
                    />

                </div>


                <button
                    type="button"
                    id="ckr-music-toggle"
                    aria-expanded="false"
                >
                    ♫ MUSIC
                </button>

            `;


            document.body.appendChild(player);


            /*
             * AUDIO ELEMENT
             */

            const audio =
                new Audio();

            audio.preload =
                "auto";

            audio.loop =
                false;

            audio.volume =
                0.35;


            /*
             * CURRENT TRACK
             */

            let current =
                0;


            /*
             * GET CONTROLS
             */

            const toggle =
                player.querySelector(
                    "#ckr-music-toggle"
                );

            const play =
                player.querySelector(
                    "#ckr-play"
                );

            const prev =
                player.querySelector(
                    "#ckr-prev"
                );

            const next =
                player.querySelector(
                    "#ckr-next"
                );

            const mute =
                player.querySelector(
                    "#ckr-mute"
                );

            const select =
                player.querySelector(
                    "#ckr-music-select"
                );

            const volume =
                player.querySelector(
                    "#ckr-music-volume"
                );

            const title =
                player.querySelector(
                    "#ckr-music-track"
                );


            /*
             * LOAD TRACK
             */

            function loadTrack(
                index,
                autoplay = false
            ) {

                current =
                    (
                        index +
                        tracks.length
                    ) %
                    tracks.length;


                const track =
                    tracks[current];


                audio.pause();


                audio.src =
                    track.src;


                audio.load();


                title.textContent =
                    track.name;


                select.value =
                    String(current);


                play.textContent =
                    "▶ Play";


                console.log(
                    "Clover Kingdom Revolution music:",
                    track.src
                );


                if (autoplay) {

                    playMusic();

                }

            }


            /*
             * PLAY MUSIC
             */

            function playMusic() {

                audio
                    .play()
                    .then(function () {

                        play.textContent =
                            "⏸ Pause";

                        console.log(
                            "Now playing:",
                            tracks[current].name
                        );

                    })
                    .catch(function (error) {

                        play.textContent =
                            "▶ Play";

                        console.error(
                            "Clover Kingdom Revolution music failed:",
                            error
                        );

                        console.error(
                            "Attempted music URL:",
                            audio.src
                        );

                    });

            }


            /*
             * OPEN / CLOSE PLAYER
             */

            toggle.addEventListener(
                "click",
                function () {

                    const open =
                        player.classList.toggle(
                            "open"
                        );

                    toggle.setAttribute(
                        "aria-expanded",
                        String(open)
                    );

                }
            );


            /*
             * PLAY / PAUSE
             */

            play.addEventListener(
                "click",
                function () {

                    if (audio.paused) {

                        playMusic();

                    } else {

                        audio.pause();

                        play.textContent =
                            "▶ Play";

                    }

                }
            );


            /*
             * PREVIOUS
             */

            prev.addEventListener(
                "click",
                function () {

                    loadTrack(
                        current - 1,
                        true
                    );

                }
            );


            /*
             * NEXT
             */

            next.addEventListener(
                "click",
                function () {

                    loadTrack(
                        current + 1,
                        true
                    );

                }
            );


            /*
             * SELECT TRACK
             */

            select.addEventListener(
                "change",
                function (event) {

                    loadTrack(
                        Number(
                            event.target.value
                        ),
                        true
                    );

                }
            );


            /*
             * MUTE
             */

            mute.addEventListener(
                "click",
                function () {

                    audio.muted =
                        !audio.muted;


                    mute.textContent =
                        audio.muted
                            ? "🔇"
                            : "🔊";

                }
            );


            /*
             * VOLUME
             */

            volume.addEventListener(
                "input",
                function (event) {

                    audio.volume =
                        Number(
                            event.target.value
                        );


                    if (
                        audio.volume > 0 &&
                        audio.muted
                    ) {

                        audio.muted =
                            false;

                        mute.textContent =
                            "🔊";

                    }

                }
            );


            /*
             * AUTOMATICALLY PLAY NEXT TRACK
             */

            audio.addEventListener(
                "ended",
                function () {

                    loadTrack(
                        current + 1,
                        true
                    );

                }
            );


            /*
             * AUDIO ERROR HANDLER
             */

            audio.addEventListener(
                "error",
                function () {

                    console.error(
                        "Clover Kingdom Revolution music file could not be loaded."
                    );

                    console.error(
                        "Music URL:",
                        audio.src
                    );

                    play.textContent =
                        "▶ Play";

                }
            );


            /*
             * INITIAL TRACK
             */

            loadTrack(
                0,
                false
            );

        }


        /*
         * WAIT FOR PAGE
         */

        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                initMusicPlayer
            );

        } else {

            initMusicPlayer();

        }

    })();

    </script>
