<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clover Kingdom Revolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#050705;
    --void-2:#0a0f0b;
    --panel:#0d130f;
    --panel-2:#111a14;
    --emerald:#1f6b45;
    --emerald-bright:#4fd88a;
    --emerald-dim:#173a29;
    --gold:#c9a227;
    --gold-bright:#e8c766;
    --parchment:#ded7c4;
    --parchment-dim:#a7a394;
    --muted:#75857c;
    --blood:#5c1520;
    --blood-bright:#c94a4a;
    --line: rgba(201,162,39,0.18);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--void);
    color:var(--parchment);
    font-family:'EB Garamond', serif;
    font-size:19px;
    line-height:1.7;
    overflow-x:hidden;
  }
  h1,h2,h3{
    font-family:'Cinzel', serif;
    font-weight:600;
    letter-spacing:0.08em;
    color:var(--gold-bright);
    margin:0;
  }
  .eyebrow{
    font-family:'Cinzel', serif;
    font-size:13px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--emerald-bright);
    margin:0 0 14px;
  }
  a{color:var(--gold-bright);}
  .wrap{max-width:1080px; margin:0 auto; padding:0 32px;}
  .divider{
    width:64px; height:2px; margin:22px auto 0;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider.left{margin-left:0;}

  /* ---------- NAV ---------- */
  nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 40px;
    background:linear-gradient(to bottom, rgba(5,7,5,0.92), transparent);
  }
  .brand{
    font-family:'Cinzel', serif; font-size:15px; letter-spacing:0.25em;
    color:var(--parchment); text-decoration:none;
  }
  .brand b{color:var(--gold-bright);}
  nav .links{display:flex; gap:34px;}
  nav .links a{
    color:var(--parchment-dim); text-decoration:none; font-family:'Cinzel', serif;
    font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
    transition:color .25s;
  }
  nav .links a:hover{color:var(--emerald-bright);}

  /* ---------- HERO ---------- */
  .hero{
    position:relative; min-height:100vh;
    display:flex; align-items:flex-end;
    background:#000;
  }
  .hero img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    object-position:50% 22%;
    opacity:0.88;
  }
  .hero::after{
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(to top, var(--void) 2%, rgba(5,7,5,0.35) 42%, rgba(5,7,5,0.15) 65%, rgba(5,7,5,0.55) 100%);
  }
  .hero-content{
    position:relative; z-index:2; width:100%;
    padding:0 40px 76px; text-align:center;
  }
  .hero h1{
    font-family:'Cinzel Decorative', serif;
    font-size:clamp(40px, 7vw, 84px);
    line-height:1.05;
    color:var(--parchment);
    text-shadow:0 0 28px rgba(79,216,138,0.35), 0 4px 18px rgba(0,0,0,0.8);
  }
  .hero h1 span{
    display:block; color:var(--emerald-bright);
    font-size:0.42em; letter-spacing:0.3em; margin-top:10px;
  }
  .hero p.tag{
    max-width:560px; margin:24px auto 0; color:var(--parchment-dim);
    font-style:italic; font-size:19px;
  }
  .cta-row{display:flex; gap:18px; justify-content:center; margin-top:38px; flex-wrap:wrap;}
  .btn{
    font-family:'Cinzel', serif; font-size:13px; letter-spacing:0.16em; text-transform:uppercase;
    padding:16px 34px; text-decoration:none; border-radius:2px;
    transition:transform .2s, box-shadow .2s, background .2s;
    display:inline-block;
  }
  .btn-primary{
    background:linear-gradient(180deg, #2a8a58, #17553a);
    color:#eafff0; border:1px solid var(--emerald-bright);
    box-shadow:0 0 22px rgba(79,216,138,0.25);
  }
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 0 32px rgba(79,216,138,0.45);}
  .btn-ghost{
    background:transparent; color:var(--gold-bright); border:1px solid var(--line);
  }
  .btn-ghost:hover{border-color:var(--gold); transform:translateY(-2px);}
  .scroll-cue{
    position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
    z-index:2; width:18px; height:30px; border:1px solid rgba(222,215,196,0.4);
    border-radius:10px;
  }
  .scroll-cue::before{
    content:""; position:absolute; top:6px; left:50%; width:3px; height:6px;
    background:var(--emerald-bright); border-radius:2px; transform:translateX(-50%);
    animation:scrollpulse 1.8s infinite;
  }
  @keyframes scrollpulse{0%{opacity:1;top:6px;}70%{opacity:0;}100%{opacity:0;top:16px;}}

  /* ---------- SECTION GENERAL ---------- */
  section{padding:130px 0; position:relative;}
  .section-head{text-align:center; max-width:680px; margin:0 auto 70px;}
  .section-head h2{font-size:clamp(26px,3.4vw,38px);}
  .section-head .divider{margin-top:22px;}
  .reveal{opacity:0; transform:translateY(28px); transition:opacity .8s ease, transform .8s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}

  /* ---------- TIMELINE ---------- */
  .timeline{position:relative; margin-top:20px;}
  .timeline::before{
    content:""; position:absolute; left:50%; top:0; bottom:0; width:1px;
    background:linear-gradient(to bottom, transparent, var(--line) 10%, var(--line) 90%, transparent);
    transform:translateX(-50%);
  }
  .t-row{display:flex; align-items:center; margin-bottom:70px; position:relative;}
  .t-row:last-child{margin-bottom:0;}
  .t-side{width:calc(50% - 40px);}
  .t-row .t-side:first-child{text-align:right; padding-right:0;}
  .t-row .t-side:last-child{padding-left:0;}
  .t-row.reverse{flex-direction:row-reverse;}
  .t-row.reverse .t-side:first-child{text-align:left;}
  .t-mark{
    position:absolute; left:50%; transform:translateX(-50%);
    width:13px; height:13px; border-radius:50%;
    background:var(--void); border:2px solid var(--gold);
    box-shadow:0 0 14px rgba(201,162,39,0.5);
  }
  .t-era{font-family:'Cinzel', serif; font-size:12px; letter-spacing:0.2em; color:var(--emerald-bright); text-transform:uppercase; margin-bottom:8px; display:block;}
  .t-side h3{font-size:20px; color:var(--parchment); font-family:'EB Garamond', serif; font-weight:600; margin-bottom:8px;}
  .t-side p{color:var(--parchment-dim); font-size:17px; margin:0;}
  .t-empty{width:calc(50% - 40px);}

  /* ---------- DEMON LORDS ---------- */
  .lords{
    display:grid; grid-template-columns:repeat(3,1fr); gap:28px;
  }
  .lord-card{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    padding:38px 28px 32px;
    text-align:center;
    position:relative;
    transition:transform .3s, border-color .3s;
  }
  .lord-card:hover{transform:translateY(-6px); border-color:var(--gold);}
  .lord-sigil{
    width:56px; height:56px; margin:0 auto 20px;
    border:1px solid var(--gold);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--gold-bright); font-family:'Cinzel Decorative', serif; font-size:22px;
  }
  .lord-card .domain{
    display:block; font-family:'Cinzel', serif; font-size:11px;
    letter-spacing:0.2em; text-transform:uppercase; color:var(--emerald-bright); margin-bottom:10px;
  }
  .lord-card h3{font-size:24px; font-family:'Cinzel Decorative', serif; color:var(--parchment); margin-bottom:14px;}
  .lord-card p{color:var(--parchment-dim); font-size:16.5px; margin:0;}

  /* ---------- LUMINARIES ---------- */
  .split{
    display:grid; grid-template-columns:1fr 1fr; gap:70px; align-items:center;
  }
  .split h2{font-size:30px; margin-bottom:18px;}
  .split p{color:var(--parchment-dim); font-size:18px;}
  .blade-frame{
    height:340px; border:1px solid var(--line);
    background:
      repeating-linear-gradient(115deg, rgba(79,216,138,0.05) 0 2px, transparent 2px 26px),
      linear-gradient(180deg, var(--panel-2), var(--void-2));
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .blade-frame svg{width:70%; height:auto;}
  .blade-glow{filter:drop-shadow(0 0 10px rgba(79,216,138,0.55));}

  /* ---------- THE ABYSSM ---------- */
  .abyssm{
    background:radial-gradient(ellipse at center, rgba(92,21,32,0.16), var(--void) 70%);
    border-top:1px solid rgba(92,21,32,0.4);
    border-bottom:1px solid rgba(92,21,32,0.4);
  }
  .abyssm .section-head .divider{
    background:linear-gradient(90deg, transparent, var(--blood-bright), transparent);
  }
  .abyssm .eyebrow{color:var(--blood-bright);}
  .seal-wrap{
    display:flex; justify-content:center; margin:10px 0 56px;
  }
  .seal-wrap svg{width:220px; height:220px;}
  .abyssm-copy{
    max-width:680px; margin:0 auto; text-align:center; color:var(--parchment-dim); font-size:18.5px;
  }
  .abyssm-copy strong{color:var(--blood-bright); font-weight:600; font-style:normal;}

  /* ---------- GRIMOIRE ARCHIVE / SUGGESTIONS ---------- */
  .grimoires-section{
    border-top:1px solid var(--line);
    background:
      radial-gradient(circle at 20% 20%, rgba(79,216,138,0.045), transparent 34%),
      linear-gradient(180deg, var(--void-2), var(--void));
  }
  .grimoire-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:24px;
  }
  .grimoire-card{
    position:relative; overflow:hidden; min-height:285px; padding:28px 24px 24px;
    background:linear-gradient(145deg, #131a15, #090d0a);
    border:1px solid var(--line);
    box-shadow:0 18px 45px rgba(0,0,0,0.24);
  }
  .grimoire-card::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(120deg, rgba(201,162,39,0.06), transparent 38%, rgba(79,216,138,0.035));
  }
  .grimoire-card .book-mark{
    width:52px; height:68px; margin-bottom:22px; position:relative;
    border:1px solid rgba(201,162,39,0.42);
    background:linear-gradient(90deg, #101711, #172219 55%, #0a0f0b);
    box-shadow:inset 7px 0 0 rgba(201,162,39,0.08), 0 0 20px rgba(79,216,138,0.06);
  }
  .grimoire-card .book-mark::after{
    content:"✦"; position:absolute; inset:0; display:grid; place-items:center;
    color:var(--gold-bright); font-size:20px;
  }
  .grimoire-card .attribute{
    display:block; color:var(--emerald-bright); font-family:'Cinzel',serif;
    font-size:11px; letter-spacing:0.18em; text-transform:uppercase; margin-bottom:8px;
  }
  .grimoire-card h3{margin-bottom:10px; color:var(--parchment); font-size:22px;}
  .grimoire-card p{color:var(--parchment-dim); font-size:16px; margin:0;}
  .grimoire-card .approved{
    display:inline-block; margin-top:22px; padding:5px 9px;
    border:1px solid rgba(79,216,138,0.25); color:var(--emerald-bright);
    font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
  }
  .grimoire-empty{
    padding:36px 24px; text-align:center; border:1px dashed var(--line);
    color:var(--muted); background:rgba(13,19,15,0.5);
  }
  .grimoire-empty strong{display:block; color:var(--parchment-dim); font-family:'Cinzel',serif; margin-bottom:7px;}
  .suggestion-panel{
    margin-top:56px; padding:34px; border:1px solid var(--line);
    background:linear-gradient(145deg, rgba(17,26,20,0.96), rgba(9,13,10,0.96));
  }
  .suggestion-panel h3{font-family:'Cinzel Decorative',serif; color:var(--parchment); font-size:26px; margin-bottom:8px;}
  .suggestion-panel > p{color:var(--parchment-dim); margin-bottom:28px;}
  .suggestion-form{display:grid; gap:18px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .form-field{display:flex; flex-direction:column; gap:8px;}
  .form-field.full{grid-column:1/-1;}
  .form-field label{
    font-family:'Cinzel',serif; font-size:11px; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--gold-bright);
  }
  .form-field input,.form-field select,.form-field textarea{
    width:100%; background:#070b08; color:var(--parchment);
    border:1px solid rgba(201,162,39,0.22); padding:13px 14px;
    font:16px 'EB Garamond',serif; outline:none; border-radius:0;
  }
  .form-field input:focus,.form-field select:focus,.form-field textarea:focus{
    border-color:var(--emerald-bright);
  }
  .form-field textarea{min-height:130px; resize:vertical;}
  .form-status{font-size:15px; color:var(--emerald-bright); min-height:24px;}
  .form-status.error{color:var(--blood-bright);}
  .community-forms{
    display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:60px;
  }
  .community-panel{
    padding:30px; border:1px solid var(--line);
    background:linear-gradient(145deg, rgba(17,26,20,0.96), rgba(9,13,10,0.96));
  }
  .community-panel h3{
    font-family:'Cinzel Decorative',serif; color:var(--parchment);
    font-size:24px; margin-bottom:8px;
  }
  .community-panel > p{color:var(--parchment-dim); margin-bottom:24px;}
  .community-form{display:grid; gap:16px;}
  .community-form .btn{cursor:pointer; width:100%;}
  .community-form button:disabled{opacity:.55; cursor:wait;}

  /* ---------- FOOTER ---------- */
  footer{
    padding:55px 24px; text-align:center;
    border-top:1px solid var(--line); background:#030403;
  }
  footer p{color:var(--muted); font-size:14px; margin:6px 0;}
  footer .footer-title{font-family:'Cinzel Decorative',serif; color:var(--gold-bright); letter-spacing:.2em;}

  /* ---------- RESPONSIVE ---------- */
  @media(max-width:800px){
    nav{padding:15px 20px;}
    nav .links{gap:12px;}
    nav .links a{font-size:10px; letter-spacing:.08em;}
    .wrap{padding:0 20px;}
    section{padding:90px 0;}
    .lords{grid-template-columns:1fr;}
    .split{grid-template-columns:1fr; gap:35px;}
    .timeline::before{left:8px;}
    .t-row,.t-row.reverse{flex-direction:row; padding-left:28px;}
    .t-side,.t-empty{width:100%;}
    .t-row .t-side:first-child,.t-row.reverse .t-side:first-child{text-align:left;}
    .t-empty{display:none;}
    .t-mark{left:8px;}
    .community-forms{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
    .suggestion-panel{padding:24px;}
    .community-panel{padding:24px;}
    .hero-content{padding:0 20px 70px;}
  }
  @media(max-width:480px){
    nav{align-items:flex-start; gap:12px; flex-direction:column;}
    nav .links{flex-wrap:wrap;}
    .hero h1{font-size:38px;}
    .btn{padding:13px 20px; font-size:11px;}
  }
</style>
</head>
