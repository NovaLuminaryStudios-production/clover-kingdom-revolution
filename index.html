    <style>

        #ckr-opening-credits {
            position: fixed;
            inset: 0;
            z-index: 999998;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    rgba(45,255,140,.035),
                    transparent 45%
                ),
                #000;

            color: white;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            opacity: 1;
            visibility: visible;

            transition:
                opacity 1.8s ease,
                visibility 1.8s ease;
        }


        #ckr-opening-credits.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        /* Subtle cinematic glow */

        #ckr-opening-credits::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(255,255,255,.035),
                    transparent 55%
                );

            pointer-events: none;
        }


        /* Actual rolling credits viewport */

        #ckr-credit-viewport {
            position: absolute;
            inset: 0;

            overflow: hidden;

            display: flex;
            justify-content: center;

            perspective: 600px;
        }


        /* The thing that actually moves */

        #ckr-credit-roll {
            position: absolute;

            width: min(700px, 88vw);

            top: 100%;

            text-align: center;

            animation:
                ckrMovieCreditRoll
                18s
                linear
                forwards;
        }


        @keyframes ckrMovieCreditRoll {

            0% {
                top: 100%;
                transform: translateY(0);
            }

            100% {
                top: -115%;
                transform: translateY(0);
            }

        }


        /* Opening production text */

        .ckr-credit-production {
            font-size: 10px;

            letter-spacing: .45em;

            font-weight: 600;

            opacity: .45;

            margin-bottom: 24px;

            text-transform: uppercase;
        }


        .ckr-credit-main-title {

            font-size:
                clamp(
                    30px,
                    6vw,
                    58px
                );

            font-weight: 800;

            letter-spacing: .16em;

            margin: 0 0 12px;

            text-transform: uppercase;
        }


        .ckr-credit-subtitle {

            font-size: 12px;

            letter-spacing: .4em;

            opacity: .5;

            margin-bottom: 100px;

            text-transform: uppercase;
        }


        /* Individual movie credits */

        .ckr-credit-block {
            margin-bottom: 75px;
        }


        .ckr-credit-role {

            font-size: 9px;

            letter-spacing: .35em;

            text-transform: uppercase;

            opacity: .38;

            margin-bottom: 14px;
        }


        .ckr-credit-name {

            font-size:
                clamp(
                    18px,
                    3vw,
                    27px
                );

            font-weight: 800;

            letter-spacing: .08em;

            margin-bottom: 7px;
        }


        .ckr-credit-user {

            font-size: 10px;

            letter-spacing: .1em;

            opacity: .32;
        }


        /* Separators */

        .ckr-credit-separator {

            width: 35px;

            height: 1px;

            background:
                rgba(255,255,255,.18);

            margin:
                55px
                auto;
        }


        /* Final title */

        .ckr-credit-final {

            margin-top: 120px;

            margin-bottom: 200px;
        }


        .ckr-credit-final-title {

            font-size:
                clamp(
                    20px,
                    4vw,
                    35px
                );

            font-weight: 800;

            letter-spacing: .18em;

            text-transform: uppercase;
        }


        .ckr-credit-final-subtitle {

            margin-top: 15px;

            font-size: 10px;

            letter-spacing: .3em;

            opacity: .4;
        }


        /* Skip button */

        #ckr-opening-skip {

            position: absolute;

            right: 120px;
            bottom: 120px;

            z-index: 10;

            padding:
                10px 18px;

            border:
                1px solid
                rgba(255,255,255,.15);

            border-radius: 999px;

            background:
                rgba(0,0,0,.55);

            color:
                rgba(255,255,255,.65);

            font-family: inherit;

            font-size: 10px;

            letter-spacing: .16em;

            cursor: pointer;

            backdrop-filter: blur(10px);

            transition:
                .25s ease;
        }


        #ckr-opening-skip:hover {

            color: white;

            border-color:
                rgba(70,255,150,.35);

            background:
                rgba(70,255,150,.08);

            transform:
                translateY(-2px);
        }


        @media (max-width: 650px) {

            #ckr-credit-roll {
                width: 88vw;
            }

            .ckr-credit-block {
                margin-bottom: 60px;
            }

        }

    </style>

    <style id="ckr-intro-style">

        #ckr-intro {

            position: fixed;

            inset: 0;

            z-index: 999997;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background: #020303;

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 1.2s ease,
                visibility 1.2s ease;

        }


        #ckr-intro.active {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

        }


        #ckr-intro.ckr-intro-hidden {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

        }


        #ckr-intro::before {

            content: "";

            position: absolute;

            inset: -20%;

            background:
                radial-gradient(
                    circle at center,
                    rgba(65,255,150,.12),
                    transparent 35%
                );

            animation:
                ckrIntroAtmosphere 8s
                ease-in-out infinite alternate;

        }


        @keyframes ckrIntroAtmosphere {

            from {
                transform: scale(1);
                opacity: .55;
            }

            to {
                transform: scale(1.15);
                opacity: 1;
            }

        }


        #ckr-intro-logo {

            position: relative;

            z-index: 3;

            width:
                min(
                    520px,
                    72vw
                );

            max-height: 65vh;

            object-fit: contain;

            opacity: 0;

            transform:
                scale(.72);

            filter:
                drop-shadow(
                    0 0 0
                    rgba(70,255,150,0)
                )
                drop-shadow(
                    0 0 30px
                    rgba(40,255,130,0)
                );

            animation:
                ckrLogoReveal
                4s
                cubic-bezier(.16,1,.3,1)
                .5s
                forwards;

        }


        @keyframes ckrLogoReveal {

            0% {

                opacity: 0;

                transform:
                    scale(.72);

            }

            55% {

                opacity: 1;

                transform:
                    scale(1.04);

                filter:
                    drop-shadow(
                        0 0 20px
                        rgba(70,255,150,.25)
                    )
                    drop-shadow(
                        0 0 70px
                        rgba(40,255,130,.25)
                    );

            }

            100% {

                opacity: 1;

                transform:
                    scale(1);

                filter:
                    drop-shadow(
                        0 0 15px
                        rgba(70,255,150,.18)
                    )
                    drop-shadow(
                        0 0 45px
                        rgba(40,255,130,.15)
                    );

            }

        }


        #ckr-intro-energy {

            position: absolute;

            z-index: 2;

            width:
                min(
                    650px,
                    90vw
                );

            aspect-ratio: 1;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(65,255,150,.18),
                    rgba(30,180,100,.08) 25%,
                    transparent 68%
                );

            opacity: 0;

            transform:
                scale(.5);

            animation:
                ckrEnergyReveal
                5s
                ease-out
                .3s
                forwards;

        }


        @keyframes ckrEnergyReveal {

            0% {

                opacity: 0;

                transform:
                    scale(.5);

            }

            45% {

                opacity: .9;

                transform:
                    scale(1);

            }

            100% {

                opacity: .35;

                transform:
                    scale(1.15);

            }

        }


        #ckr-intro-welcome {

            position: absolute;

            z-index: 4;

            bottom: 13%;

            left: 0;
            right: 0;

            text-align: center;

            color: #fff;

            font-size:
                clamp(
                    14px,
                    2vw,
                    22px
                );

            font-weight: 500;

            letter-spacing: .5em;

            text-transform: uppercase;

            opacity: 0;

            animation:
                ckrWelcomeReveal
                2s
                ease
                4.5s
                forwards;

        }


        @keyframes ckrWelcomeReveal {

            to {
                opacity: .85;
            }

        }


        #ckr-intro-skip {

            position: absolute;

            z-index: 10;

            right: 24px;

            bottom: 24px;

            padding: 10px 18px;

            border:
                1px solid
                rgba(255,255,255,.18);

            border-radius: 999px;

            background:
                rgba(0,0,0,.45);

            color:
                rgba(255,255,255,.75);

            font-size: 11px;

            letter-spacing: .15em;

            text-transform: uppercase;

            cursor: pointer;

        }

    </style>

    <!-- =====================================================
         MUSIC PLAYER
         ===================================================== -->

    <script>

    (function () {

        const BASE_PATH =
            "/clover-kingdom-revolution/";


        const tracks = [

            {
                name:
                    "Wonders of the Earth",

                src:
                    BASE_PATH +
                    "music/wonders-of-the-earth.mp3"
            },


            {
                name:
                    "Total War — Epic Action",

                src:
                    BASE_PATH +
                    "music/total-war-epic-action.mp3"
            },


            {
                name:
                    "Music Promotion",

                src:
                    BASE_PATH +
                    "music/music-promotion.mp3"
            },


            {
                name:
                    "Epic",

                src:
                    BASE_PATH +
                    "music/kornevmusic-epic-478847.mp3"
            }

        ];


        function initMusicPlayer() {

            if (
                document.getElementById(
                    "ckr-music-player"
                )
            ) return;


            const player =
                document.createElement("div");


            player.id =
                "ckr-music-player";


            player.innerHTML = `

                <div id="ckr-music-panel">

                    <div id="ckr-music-title">
                        CLOVER KINGDOM REVOLUTION • MUSIC
                    </div>

                    <div id="ckr-music-track">
                        Wonders of the Earth
                    </div>

                    <div id="ckr-music-controls">

                        <button id="ckr-prev">
                            ⏮
                        </button>

                        <button id="ckr-play">
                            ▶ Play
                        </button>

                        <button id="ckr-next">
                            ⏭
                        </button>

                        <button id="ckr-mute">
                            🔊
                        </button>

                    </div>


                    <select id="ckr-music-select">

                        ${tracks.map(
                            (track,index) =>
                            `<option value="${index}">
                                ${track.name}
                            </option>`
                        ).join("")}

                    </select>


                    <input
                        id="ckr-music-volume"
                        type="range"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.35"
                    />

                </div>


                <button
                    id="ckr-music-toggle"
                    aria-expanded="false"
                >
                    ♫ MUSIC
                </button>

            `;


            document.body.appendChild(player);


            const audio =
                new Audio();


            audio.preload =
                "auto";

            audio.volume =
                .35;


            let current =
                0;


            const toggle =
                player.querySelector(
                    "#ckr-music-toggle"
                );


            const play =
                player.querySelector(
                    "#ckr-play"
                );


            const prev =
                player.querySelector(
                    "#ckr-prev"
                );


            const next =
                player.querySelector(
                    "#ckr-next"
                );


            const mute =
                player.querySelector(
                    "#ckr-mute"
                );


            const select =
                player.querySelector(
                    "#ckr-music-select"
                );


            const volume =
                player.querySelector(
                    "#ckr-music-volume"
                );


            const title =
                player.querySelector(
                    "#ckr-music-track"
                );


            function loadTrack(
                index,
                autoplay = false
            ) {

                current =
                    (
                        index +
                        tracks.length
                    ) %
                    tracks.length;


                audio.pause();


                audio.src =
                    tracks[current].src;


                audio.load();


                title.textContent =
                    tracks[current].name;


                select.value =
                    String(current);


                play.textContent =
                    "▶ Play";


                if (autoplay) {

                    audio.play()
                        .then(() => {

                            play.textContent =
                                "⏸ Pause";

                        })
                        .catch(() => {});

                }

            }


            toggle.addEventListener(
                "click",
                () => {

                    const open =
                        player.classList.toggle(
                            "open"
                        );

                    toggle.setAttribute(
                        "aria-expanded",
                        String(open)
                    );

                }
            );


            play.addEventListener(
                "click",
                () => {

                    if (
                        audio.paused
                    ) {

                        audio.play()
                            .then(() => {

                                play.textContent =
                                    "⏸ Pause";

                            })
                            .catch(() => {});

                    } else {

                        audio.pause();

                        play.textContent =
                            "▶ Play";

                    }

                }
            );


            prev.addEventListener(
                "click",
                () => {

                    loadTrack(
                        current - 1,
                        true
                    );

                }
            );


            next.addEventListener(
                "click",
                () => {

                    loadTrack(
                        current + 1,
                        true
                    );

                }
            );


            select.addEventListener(
                "change",
                event => {

                    loadTrack(
                        Number(
                            event.target.value
                        ),
                        true
                    );

                }
            );


            mute.addEventListener(
                "click",
                () => {

                    audio.muted =
                        !audio.muted;

                    mute.textContent =
                        audio.muted
                            ? "🔇"
                            : "🔊";

                }
            );


            volume.addEventListener(
                "input",
                event => {

                    audio.volume =
                        Number(
                            event.target.value
                        );

                    if (
                        audio.volume > 0
                    ) {

                        audio.muted =
                            false;

                        mute.textContent =
                            "🔊";

                    }

                }
            );


            audio.addEventListener(
                "ended",
                () => {

                    loadTrack(
                        current + 1,
                        true
                    );

                }
            );


            loadTrack(
                0,
                false
            );

        }


        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                initMusicPlayer
            );

        } else {

            initMusicPlayer();

        }

    })();

    </script>


    <!-- =====================================================
         INTRO SEQUENCE CONTROLLER
         ===================================================== -->

    <script>

    (function () {

        const credits =
            document.getElementById(
                "ckr-opening-credits"
            );


        const intro =
            document.getElementById(
                "ckr-intro"
            );


        const creditSkip =
            document.getElementById(
                "ckr-opening-skip"
            );


        const introSkip =
            document.getElementById(
                "ckr-intro-skip"
            );


        if (
            !credits ||
            !intro
        ) return;


        let finished =
            false;


        function startLogoIntro() {

            if (finished) return;

            finished = true;


            credits.classList.add(
                "hidden"
            );


            setTimeout(
                function () {

                    intro.classList.add(
                        "active"
                    );


                    setTimeout(
                        function () {

                            intro.classList.add(
                                "ckr-intro-hidden"
                            );

                        },
                        7500
                    );


                    setTimeout(
                        function () {

                            intro.remove();

                        },
                        8800
                    );

                },
                1800
            );

        }


        /*
         * The rolling credits take
         * approximately 18 seconds.
         */

        setTimeout(
            startLogoIntro,
            18500
        );


        /*
         * Skip credits.
         */

        if (creditSkip) {

            creditSkip.addEventListener(
                "click",
                startLogoIntro
            );

        }


        /*
         * Skip logo intro.
         */

        if (introSkip) {

            introSkip.addEventListener(
                "click",
                function () {

                    intro.classList.add(
                        "ckr-intro-hidden"
                    );


                    setTimeout(
                        function () {

                            intro.remove();

                        },
                        1300
                    );

                }
            );

        }

    })();
